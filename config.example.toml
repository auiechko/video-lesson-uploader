[telegram]
api_id = 12345678
# API hash зберігається через keyring, а session path GUI визначає автоматично.
session = "C:\\Users\\YOUR_NAME\\AppData\\Roaming\\LessonVideoUploader\\profiles\\main\\telegram\\telegram"
phone = "+380991234567"

[google_calendar]
# Шлях можна вибрати у GUI. Файл створюється в Google Cloud як OAuth Client
# типу Desktop app; сам файл не додавайте до Git.
client_secrets = ""
calendar_id = "primary"
timezone = "Europe/Kyiv"
calendar_conflict_tolerance_minutes = 10

[caption]
# Використовується лише коли один урок має понад 10 MP4.
album_batch = " (альбом {album_number}/{album_count})"
