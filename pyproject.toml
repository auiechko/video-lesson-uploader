[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lesson-video-uploader"
version = "0.1.0"
description = "Send all videos from one lesson as a Telegram album."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
    "telethon>=1.34,<2",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.6,<8",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[project.scripts]
lesson-video-uploader = "lesson_video_uploader.cli:main"

[project.gui-scripts]
lesson-video-uploader-gui = "lesson_video_uploader.desktop:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
